[project]
name = "aws-nova-sonic-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aws-sdk-bedrock-runtime>=0.1.0,<0.2.0",
    "boto3>=1.44.9",
    "pyaudio>=0.2.14",
    "smithy-aws-core>=0.0.1",
    "tzdata>=2026.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installs the shared `sonic` package into the venv so gallery/ scripts can import it.
[tool.hatch.build.targets.wheel]
packages = ["sonic"]
